# xharness configuration. Copy to config/harness.local.yaml and edit.
# Secrets are NEVER put here. Use environment variables:
#   WALLX_HEADERS_FILE=~/.config/xharness/wallx-headers.json   (chmod 600)
#   AGENT_CHAT_URL / AGENT_MODEL / AGENT_API_KEY               (vision model)

wallx:
  endpoint: wss://maas-api.x2robot.com/v1/vla/wallx   # or the on-site ws://host:port
  open_timeout_s: 15
  # Measured warm-up 4.0 s (probe 2026-11-12, n=1).
  first_request_timeout_s: 20
  # Measured steady median 0.61 s, max 0.67 s (n=5). Venue network will be worse.
  request_timeout_s: 8
  reconnect_attempts: 1          # per failed request; actions are never replayed

listen:
  host: 0.0.0.0                  # robot connects to ws://<your LAN IP>:8001
  port: 8001

task_files:
  - config/tasks/d2_case1_cover.yaml
  - config/tasks/d2_case2_core.yaml
  - config/tasks/d2_case3_pin.yaml

verifier:
  enabled: true
  timeout_s: 8
  image_max_side: 512
  cameras: [front, left_wrist, right_wrist]
  max_tokens: 150               # reply is tiny JSON; Groq free tier caps output tokens per minute
  extra_body: {}                # e.g. {reasoning_effort: none} to turn off thinking on Groq Qwen

supervisor:
  verify_every: 2               # vision check every 2nd Wall-X request
  still_threshold_m: 0.005
  grasp_band: [0.08, 1.30]      # MEASURE: gripper reading while holding a part
  open_above: 1.0               # MEASURE: reading when fully open
  stall_margin: 0.05
  state_file: runs/supervisor_state.json
  unknown_goal: passthrough     # goal with no task file: forward unchanged

hold:
  on_done: true                 # task complete -> keep arms still (nobody may touch a keyboard)
  on_upstream_failure: true     # Wall-X down/slow -> keep arms still, keep asking
  on_task_failed: true

filter:
  mode: enforce                 # off | log | enforce. enforce = unsafe chunk -> HOLD (confirm with organizers)
  max_row_step_m: 0.05
  max_first_row_jump_m: 0.10
  max_row_rot_step_rad: 0.35
  freeze_idle_arm: false        # ask organizers before enabling
  # PLACEHOLDER boxes (robot base frame, metres). Replace with measured limits:
  # run a few direct Wall-X episodes, then: python tools/workspace_from_runs.py runs/
  workspace:
    left_ee:  {min: [-1.0, -1.0, -1.0], max: [1.0, 1.0, 1.0]}
    right_ee: {min: [-1.0, -1.0, -1.0], max: [1.0, 1.0, 1.0]}

recorder:
  dir: runs
  save_frames: true
  frame_every: 1

finisher:                       # harness-generated final alignment and press. approved by organizers (#13); OFF until seated_z is measured
  enabled: false
  # The press target is ABSOLUTE: each finisher stage in config/tasks/*.yaml needs seated_z (gripper z, metres,
  # with the part hand-placed fully seated; MEASURE ON SITE). Without it the finisher never presses.
  overtravel_mm: 0.5            # PLACEHOLDER: command this far below seated_z
  hard_floor_mm: 1.0            # absolute floor = target minus this
  fast_step_mm: 5.0             # PLACEHOLDER descent step until 3 mm above seated_z
  contact_margin_mm: 0.5        # PLACEHOLDER settled lag that means resistance
  jam_zone_mm: 2.0              # PLACEHOLDER resistance further above seated_z than this is a jam
  grip_command: 0.0             # PLACEHOLDER gripper command that keeps a part gripped
  open_above: 1.0               # PLACEHOLDER reading that counts as open
  # explore_mm 3, gain 0.6, max_step_mm 3, converge_mm 0.3, press_step_mm 1, lift_mm 30: see FinisherConfig
