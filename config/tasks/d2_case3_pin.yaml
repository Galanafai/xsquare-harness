# Demo 2, case 3: insert the purple pin until it snaps in.
# Prop: the team's four-part design (xharness/parts.py; v12 at 200% by default). The
# organizers' A-board cases still describe the older shell, slider and two-button toy;
# these cases follow the team design's assembly order and are PLACEHOLDERS until the
# organizers confirm cases for the new prop.
#
# `goal` MUST equal the case `instruction` in the WebUI task JSON
# (config/webui/local_d2_snapfit.json), because the robot client sends it on
# every request and the supervisor uses it to pick this file.
#
# Colors come from xharness/parts.py (green cover, blue main, orange core, purple pin,
# white grip pads). Change them here if the prints differ.
#
# Stage pattern: the gripper covers the target while it presses, so "seated?" is only
# judged after it lets go: grasp -> align -> push -> release -> seated (`hold: true`,
# arms still, vision looks). Confirmations: 2, except 1 for release.
#
# This is the precision snap (the step that sets K). The pin has a tapered barbed nose:
# capture about +-2.4 mm at v12 (+-1.2 mm at v11), xharness/parts.py FIT_MM.
# UNKNOWN: the pin lies on a sleeve flat for pickup; if the bore points up it must be
# turned 90 degrees in the gripper first. Neither Wall-X nor the finisher is known to do that.
#
# With finisher.enabled the push and release stages are replaced by a `finisher` stage
# (xharness/finisher.py: servo, press, release, lift) and a failed seated check loops back
# to grasp, at most max_loops times. Without it (default) the stages marked `only: wallx` run.

task_id: d2_case3_pin
goal: "Insert the purple pin into the toy until it snaps in."
context: >
  Tabletop toy assembly. The blue main body with the green cover and orange core
  inside lies at the center, with the pin hole showing through the slot on top. A
  loose purple pin (about 20 mm wide, 54 mm long) with a white flat handle lies on
  the table.

stages:
  - id: grasp_pin
    instructions:
      - "Pick up the purple pin by its white handle."
      - "Grasp the purple pin and lift it."
    done:
      question: "Is the purple pin held between one gripper's fingers and lifted off the table?"
      confirmations: 2
    budget_requests: 12
    max_retries: 2

  - id: align_pin
    instructions:
      - "Move the purple pin above the hole in the toy."
      - "Hold the purple pin just above the pin hole, pointing down."
    done:
      question: "Is the purple pin directly above the pin hole in the toy, within about 2 cm?"
      confirmations: 2
      require_still: true
    budget_requests: 10
    max_retries: 2

  - id: finish_pin
    type: finisher
    only: finisher
    part: pin
    seated_z: null   # MEASURE ON SITE: gripper z (m, observation.state) with the pin hand-placed fully seated. null = never press
    target: "pin_bore"
    budget_requests: 90
    on_fail_goto: align_pin
    max_loops: 2

  - id: push_pin
    only: wallx
    instructions:
      - "Press the purple pin down into the hole."
      - "Push the purple pin straight down into the toy."
    done:
      question: "Is the purple pin pushed down into the toy, touching it with no visible gap?"
      confirmations: 2
      require_still: true
    budget_requests: 12
    max_retries: 2

  - id: release_pin
    only: wallx
    instructions:
      - "Release the purple pin and move the arm up and away."
      - "Open the gripper and lift the arm straight up."
    done:
      question: "Is the gripper open and lifted clear above the toy, no longer touching the pin?"
      confirmations: 1
    budget_requests: 6
    max_retries: 1
    optional: true

  - id: seated_pin
    on_fail_goto: grasp_pin
    max_loops: 2
    done:
      question: "Is the purple pin seated down in the toy, with only its handle sticking out (not lying on top or on the table)?"
      confirmations: 2
    budget_requests: 6
    max_retries: 1
    hold: true
