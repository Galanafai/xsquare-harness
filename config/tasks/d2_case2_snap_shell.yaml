# Demo 2, A-board case 2: snap the outer shell onto the handle + slider.
# Start: handle with slider fitted (in the holder), loose green shell.
#
# Stage pattern for every press (changed 2026-11-12): the gripper covers the
# hole while it presses, so "seated?" cannot be judged then. Each part goes
#   grasp -> align -> push (contact check) -> release (open and lift)
#   -> seated (a `hold: true` stage: arms stay still, vision looks at the hole).
# With finisher.enabled the push and release stages are replaced by a `finisher` stage
# (xharness/finisher.py: servo, press, release, lift) and a failed seated check loops back
# to grasp, at most max_loops times. Without it (default) the stages marked `only: wallx` run.
# Confirmations: 2 for grasp, align, push and seated; 1 for release.

task_id: d2_case2_snap_shell
goal: "Snap the green shell onto the toy."
context: >
  Tabletop toy assembly. The white handle with the orange slider already
  fitted sits in a holder at the center. A loose green shell (70x33x23.5 mm)
  lies on the table to one side.

stages:
  - id: grasp_shell
    instructions:
      - "Pick up the green shell."
      - "Grasp the green shell and lift it."
    done:
      question: "Is the green shell held between one gripper's fingers and lifted off the table?"
      confirmations: 2
    budget_requests: 12
    max_retries: 2

  - id: align_shell
    instructions:
      - "Move the green shell above the white handle."
      - "Hold the green shell just above the toy in the holder, lined up with it."
    done:
      question: "Is the green shell directly above the toy in the holder, lined up lengthwise, within about 3 cm?"
      confirmations: 2
      require_still: true
    budget_requests: 10
    max_retries: 2

  - id: finish_shell
    type: finisher
    only: finisher
    part: shell
    target: "shell_seat"
    budget_requests: 90
    on_fail_goto: align_shell
    max_loops: 2

  - id: push_shell
    only: wallx
    instructions:
      - "Press the green shell down onto the white handle."
      - "Push the green shell down until it snaps onto the toy."
    done:
      question: "Is the green shell pushed down onto the white handle, touching it with no visible gap between them?"
      confirmations: 2
      require_still: true
    budget_requests: 12
    max_retries: 2

  - id: release_shell
    only: wallx
    instructions:
      - "Release the green shell and move the arm up and away."
      - "Open the gripper and lift the arm straight up."
    done:
      question: "Is the gripper open and lifted clear above the toy, no longer touching the shell?"
      confirmations: 1
    budget_requests: 6
    max_retries: 1
    optional: true

  - id: seated_shell
    on_fail_goto: grasp_shell
    max_loops: 2
    done:
      question: "Is the green shell sitting flat on the white handle with no gap, fully snapped on?"
      confirmations: 2
    budget_requests: 6
    max_retries: 1
    hold: true
