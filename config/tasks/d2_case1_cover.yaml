# Demo 2, case 1: attach the green cover to the blue main body.
# Prop: the team's four-part design (xharness/parts.py; v12 at 200% by default). The
# organizers' A-board cases still describe the older shell, slider and two-button toy;
# these cases follow the team design's assembly order and are PLACEHOLDERS until the
# organizers confirm cases for the new prop.
#
# `goal` MUST equal the case `instruction` in the WebUI task JSON
# (config/webui/local_d2_snapfit.json), because the robot client sends it on
# every request and the supervisor uses it to pick this file.
#
# Colors come from xharness/parts.py (green cover, blue main, orange core, purple pin,
# white grip pads). Change them here if the prints differ.
#
# Stage pattern: the gripper covers the target while it presses, so "seated?" is only
# judged after it lets go: grasp -> align -> push -> release -> seated (`hold: true`,
# arms still, vision looks). Confirmations: 2, except 1 for release.
#
# Real motion: the cover is fed onto two diagonal pivot guides at 80 to 90 degrees, then
# swung closed. The sim models it as a straight press. No finisher stage here: the
# finisher only does straight-down presses.

task_id: d2_case1_cover
goal: "Attach the green cover to the blue main body."
context: >
  Tabletop toy assembly. A blue main body (about 80 x 200 mm) lies at the center.
  A loose green cover (about 66 x 200 mm) with a white grip pad lies on the table
  to one side.

stages:
  - id: grasp_cover
    instructions:
      - "Pick up the green cover by its white grip pad."
      - "Grasp the green cover and lift it."
    done:
      question: "Is the green cover held between one gripper's fingers and lifted off the table?"
      confirmations: 2
    budget_requests: 12
    max_retries: 2

  - id: align_cover
    instructions:
      - "Move the green cover above the blue main body."
      - "Hold the green cover just above the blue main body, lined up with it."
    done:
      question: "Is the green cover directly above the blue main body, lined up lengthwise, within about 3 cm?"
      confirmations: 2
      require_still: true
    budget_requests: 10
    max_retries: 2

  - id: push_cover
    instructions:
      - "Close the green cover onto the blue main body and press it down."
      - "Seat the green cover on the blue main body."
    done:
      question: "Is the green cover resting on the blue main body, touching it with no visible gap?"
      confirmations: 2
      require_still: true
    budget_requests: 12
    max_retries: 2

  - id: release_cover
    instructions:
      - "Release the green cover and move the arm up and away."
      - "Open the gripper and lift the arm straight up."
    done:
      question: "Is the gripper open and lifted clear above the toy, no longer touching the cover?"
      confirmations: 1
    budget_requests: 6
    max_retries: 1
    optional: true

  - id: seated_cover
    on_fail_goto: grasp_cover
    max_loops: 2
    done:
      question: "Is the green cover closed flat on the blue main body (not tilted, not resting on an edge)?"
      confirmations: 2
    budget_requests: 6
    max_retries: 1
    hold: true
