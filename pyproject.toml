[project]
name = "xharness"
version = "0.1.0"
description = "Agent harness between the X Square desktop robot client and the Wall-X VLA (BRIGHT 2026 hackathon)."
requires-python = ">=3.10"
dependencies = [
    "websockets>=15,<18",
    "msgpack>=1.0,<2",
    "msgpack-numpy>=0.4.8,<0.5",
    "numpy>=1.26,<3",
    "pillow>=10",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["xharness", "sim"]
